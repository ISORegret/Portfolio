name: Import Caffeine Octane 09.12.26
on:
  push:
    paths:
      - '.github/workflows/import-co-091226.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download and optimize gallery
        env:
          ZIP_URL: https://at.adobe.com/EprwgTiTbNeZVXEC
        run: |
          set -e
          rm -rf /tmp/co912 public/gallery/caffeine-octane-jacksonville-2026-09-12
          mkdir -p /tmp/co912 public/gallery/caffeine-octane-jacksonville-2026-09-12
          curl -L "$ZIP_URL" -o /tmp/co912.zip
          unzip -q /tmp/co912.zip -d /tmp/co912
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('/tmp/co912')
          out = Path('public/gallery/caffeine-octane-jacksonville-2026-09-12')
          files = sorted(src.rglob('*.jpg')) + sorted(src.rglob('*.JPG')) + sorted(src.rglob('*.jpeg')) + sorted(src.rglob('*.JPEG'))
          for p in files:
              im = Image.open(p).convert('RGB')
              im.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
              im.save(out / (p.stem.lower() + '.webp'), 'WEBP', quality=82, method=6)
          print(f'Optimized {len(files)} images')
          PY
          cp public/gallery/caffeine-octane-jacksonville-2026-09-12/dsc04318.webp public/gallery/caffeine-octane-jacksonville-2026-09-12/cover.webp
      - name: Commit gallery
        run: |
          git config user.name "ISORegret"
          git config user.email "rtaylorbrick@gmail.com"
          git add public/gallery/caffeine-octane-jacksonville-2026-09-12
          git commit -m "Import Caffeine and Octane 09.12.26 gallery" || exit 0
          git push
