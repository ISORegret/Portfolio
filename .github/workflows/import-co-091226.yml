name: Import Caffeine Octane 09.12.26
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-co-091226.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized gallery
        run: |
          curl -L --fail --retry 3 'https://at.adobe.com/xnJL5p61LKmuuJOZ' -o /tmp/gallery.zip
          rm -rf /tmp/gallery
          mkdir -p /tmp/gallery
          unzip -q /tmp/gallery.zip -d /tmp/gallery
          mkdir -p public/gallery/caffeine-octane-jacksonville-2026-09-12
          cp /tmp/gallery/co912_web/*.webp public/gallery/caffeine-octane-jacksonville-2026-09-12/
      - name: Commit gallery
        run: |
          git config user.name 'ISORegret'
          git config user.email 'rtaylorbrick@gmail.com'
          git add public/gallery/caffeine-octane-jacksonville-2026-09-12
          git diff --cached --quiet && exit 0
          git commit -m 'Upload Caffeine and Octane 09.12.26 gallery'
          git push
